name: Monitor dependencies with Dependabot
on:
#  push:
#    branches:
#      - main
#    paths:
#      - 'apps/backend/pom.xml'
  workflow_dispatch:
jobs:
  dependabot:
    name: Monitor dependencies with Dependabot
    runs-on: ubuntu-latest
    permissions: # The Dependency Submission API requires write permission
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - name: Submit Dependency Snapshot
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # ratchet:advanced-security/maven-dependency-submission-action@v6.0.1
