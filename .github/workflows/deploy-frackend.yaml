name: 'deploy: frackend'

on:
  push:
    branches:
      - 'main'
      - 'dev/*'
    paths:
      - '.github/workflows/deploy-frackend.yaml'
      - 'apps/frackend/**'
      - 'apps/frontend/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/teamfrackend:${{ github.sha }}

jobs:
  build-app-docker:
    name: Build and push docker
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'

      - name: Install frontend
        working-directory: apps/frontend
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

      - name: Copy frontend dist into public directory of frackend
        working-directory: apps/frontend
        run: cp -r dist/ ../frackend/public

      - name: Install frackend dependencies
        working-directory: apps/frackend
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Build frackend
        working-directory: apps/frackend
        run: npm run build

      - name: Build and push Docker image
        uses: nais/docker-build-push@d3a1f7e259ecc381a50435e1d4add9059429ebd7 # ratchet:nais/docker-build-push@v0
        id: docker-push
        with:
          team: nom
          image_suffix: nom-ui2
          docker_context: apps/frackend
          dockerfile: apps/frackend/Dockerfile
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
    outputs:
      image: ${{ steps.docker-push.outputs.image }}

  deploy-dev:
    name: Deploy dev-gcp
    needs: build-app-docker
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # ratchet:nais/deploy/actions/deploy@v3
        name: deploy unleash token for frackend (dev)
        env:
          CLUSTER: dev-gcp
          RESOURCE: apps/frackend/nais/frackend-unleash.yaml
          VAR: env=development
      - uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # ratchet:nais/deploy/actions/deploy@v3
        name: deploy frackend application (dev)
        env:
          CLUSTER: dev-gcp
          RESOURCE: apps/frackend/nais/frackend-dev.yaml
          VAR: image=${{needs.build-app-docker.outputs.image}}


  deploy-prod:
    name: Deploy prod-gcp
    needs: build-app-docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # ratchet:nais/deploy/actions/deploy@v3
        name: deploy unleash token for frackend (prod)
        env:
          CLUSTER: prod-gcp
          RESOURCE: apps/frackend/nais/frackend-unleash.yaml
          VAR: env=production
      - uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # ratchet:nais/deploy/actions/deploy@v3
        name: deploy frackend application (prod)
        env:
          CLUSTER: prod-gcp
          RESOURCE: apps/frackend/nais/frackend-prod.yaml
          VAR: image=${{needs.build-app-docker.outputs.image}}

