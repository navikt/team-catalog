name: "verify: backend"

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'apps/backend/**'
      - '.github/workflows/verify-backend.yaml'
      - 'apps/backend/pom.xml'
  workflow_dispatch:

jobs:
  verify:
    name: Verify backend compiles and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - name: Cache Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Run tests
        env:
          GITHUB_USERNAME: x-access-token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn clean test --also-make --batch-mode
