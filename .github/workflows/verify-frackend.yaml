name: "verify: frackend"

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'apps/frackend/**'
      - '.github/*/verify-frackend.yaml'

jobs:
  verify:
    name: Verify there are no lint or typescript errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'
      - name: Install dependencies
        working-directory: apps/frackend
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Run ESLint
        working-directory: apps/frackend
        run: npm run lint

      - name: Check for typescript errors
        working-directory: apps/frackend
        run: npm run check-types
