name: "verify: frontend"

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'apps/frontend/**'
      - '.github/*/verify-frontend.yaml'

jobs:
  verify:
    name: Verify there are no lint or typescript errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com/
          scope: '@navikt'
          cache: 'npm'
          cache-dependency-path: apps/frontend
      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Run ESLint
        working-directory: apps/frontend
        run: npm run lint

      - name: Run Stylelint
        working-directory: apps/frontend
        run: npm run stylelint

      - name: Check for typescript errors
        working-directory: apps/frontend
        run: npm run check-types
